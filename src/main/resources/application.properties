# ---------------------------------------------------------------------------
# Employee Manager - CST-323 Cloud Computing
#
# Every environment-specific value below is read from an environment variable
# with a local development default after the colon. Nothing here needs to change
# to move the application between cloud platforms: set the variables on the
# platform instead (Azure App Service application settings, container env vars,
# Kubernetes ConfigMap/Secret, and so on).
#
# The default username and password match docker-compose.yml and are for local
# development only. Real deployments MUST supply DB_USER and DB_PASSWORD from
# the platform's secret store.
# ---------------------------------------------------------------------------

spring.application.name=employee-manager

# Many PaaS hosts inject the port they expect the app to listen on.
server.port=${PORT:8080}

# --- Database -------------------------------------------------------------
# DB_SSL_MODE is DISABLED for the local Docker container; managed MySQL services
# such as Azure Database for MySQL Flexible Server require REQUIRED.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:employeedb}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:employee_app}
spring.datasource.password=${DB_PASSWORD:employee_app_pw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Conservative pool sizing: managed database tiers cap connections aggressively.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}

# --- JPA ------------------------------------------------------------------
# Flyway owns the schema, so Hibernate only verifies that the mapping matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---------------------------------------------------------------
# Creates the schema and seed data the first time the app meets an empty database,
# then records what it applied so redeploys are safe to repeat.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Templates ------------------------------------------------------------
# Cached by default; spring-boot-devtools disables this automatically when running locally.
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# --- Error pages ----------------------------------------------------------
server.error.include-message=always
server.error.whitelabel.enabled=false

# --- Health and monitoring ------------------------------------------------
# /health          - lightweight liveness probe implemented by HealthController
# /actuator/health - readiness probe, includes database connectivity
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Employee Manager
info.app.course=CST-323 Cloud Computing

# --- Logging --------------------------------------------------------------
# Every CRUD operation is logged at INFO by the service layer.
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.edu.gcu.cst323.employeemanager=${APP_LOG_LEVEL:INFO}
