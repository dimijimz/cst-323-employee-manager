<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  One template serves both /employees/new and /employees/{id}/edit. The controller
  supplies pageTitle and formAction; everything else is identical between the two.
-->
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/layout :: navbar('employees')}"></nav>

<main class="container">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/employees}">Employees</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${pageTitle}">Add Employee</li>
        </ol>
    </nav>

    <h1 class="h3 mb-4" th:text="${pageTitle}">Add Employee</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{${formAction}}" th:object="${employee}" method="post" novalidate>

                <!-- Lives inside the form: #fields resolves against the enclosing th:object. -->
                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                    Please correct the highlighted fields below.
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First name</label>
                        <input type="text" id="firstName" class="form-control"
                               th:field="*{firstName}"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{firstName}">First name error</div>
                    </div>

                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last name</label>
                        <input type="text" id="lastName" class="form-control"
                               th:field="*{lastName}"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{lastName}">Last name error</div>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}">Email error</div>
                    </div>

                    <div class="col-md-6">
                        <label for="hireDate" class="form-label">Hire date</label>
                        <input type="date" id="hireDate" class="form-control"
                               th:field="*{hireDate}"
                               th:classappend="${#fields.hasErrors('hireDate')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{hireDate}">Hire date error</div>
                    </div>

                    <div class="col-md-6">
                        <label for="department" class="form-label">Department</label>
                        <select id="department" class="form-select"
                                th:field="*{department}"
                                th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'">
                            <option value="">-- Select a department --</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.name}">Engineering</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{department}">Department error</div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/employees}">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
