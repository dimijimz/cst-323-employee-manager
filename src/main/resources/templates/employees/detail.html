<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Employee Detail')}"></head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/layout :: navbar('employees')}"></nav>

<main class="container">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/employees}">Employees</a></li>
            <li class="breadcrumb-item active" aria-current="page"
                th:text="${employee.fullName}">Jane Doe</li>
        </ol>
    </nav>

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0" th:text="${employee.fullName}">Jane Doe</h1>
            <span class="badge text-bg-secondary" th:text="'ID ' + ${employee.id}">ID 1</span>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">First name</dt>
                <dd class="col-sm-9" th:text="${employee.firstName}">Jane</dd>

                <dt class="col-sm-3">Last name</dt>
                <dd class="col-sm-9" th:text="${employee.lastName}">Doe</dd>

                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9">
                    <a th:href="'mailto:' + ${employee.email}"
                       th:text="${employee.email}">jane.doe@example.com</a>
                </dd>

                <dt class="col-sm-3">Hire date</dt>
                <dd class="col-sm-9"
                    th:text="${#temporals.format(employee.hireDate, 'MMMM d, yyyy')}">January 15, 2020</dd>

                <dt class="col-sm-3">Department</dt>
                <dd class="col-sm-9 mb-0" th:text="${employee.department.name}">Engineering</dd>
            </dl>
        </div>
        <div class="card-footer d-flex gap-2">
            <a class="btn btn-primary"
               th:href="@{/employees/{id}/edit(id=${employee.id})}">Edit</a>
            <a class="btn btn-outline-secondary" th:href="@{/employees}">Back to list</a>
            <form class="ms-auto"
                  th:action="@{/employees/{id}/delete(id=${employee.id})}"
                  method="post"
                  onsubmit="return confirm(&#39;Delete this employee? This cannot be undone.&#39;)">
                <button type="submit" class="btn btn-outline-danger">Delete</button>
            </form>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
