<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Shared page furniture. Every page pulls in these fragments so the four views
  stay consistent without a templating engine beyond plain Thymeleaf.
  Bootstrap 5 is loaded from a CDN, which keeps the deployable jar small and
  identical across cloud targets.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Employee Manager'">Employee Manager</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Employee Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                       th:classappend="${active == 'home'} ? 'active'">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees}"
                       th:classappend="${active == 'employees'} ? 'active'">Employees</a>
                </li>
            </ul>
            <a class="btn btn-primary" th:href="@{/employees/new}">Add Employee</a>
        </div>
    </div>
</nav>

<!-- Success banner shown after a redirect from create, update or delete. -->
<div th:fragment="flash" th:if="${message}" class="container">
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}">Saved.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<footer th:fragment="footer" class="container border-top mt-5 py-3 text-muted small">
    <span>CST-323 Cloud Computing &middot; Spring Boot CRUD reference application</span>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
