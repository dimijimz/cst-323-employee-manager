# Test-only overrides. The suite runs against an in-memory H2 database in MySQL
# compatibility mode so `mvnw test` needs no running MySQL container.
# Flyway is disabled here because the migrations are written in MySQL DDL;
# Hibernate generates the equivalent schema from the same entity mappings.

spring.datasource.url=jdbc:h2:mem:employeedb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.thymeleaf.cache=false

logging.level.root=INFO
logging.level.edu.gcu.cst323.employeemanager=INFO
